    <h3><span>◈</span> 一个属于创作者的小小工作台</h3>
    <p>YCence 是一个轻量的前端工具箱，把常用的小工具集中在一个页面里。它没有后端、没有账号、没有隐私收集，所有功能都在浏览器本地完成。</p>
    <p>目前它承载三件事：收集整理用户脚本、临时执行 JavaScript、以及向每一个打开它的人自我介绍。</p>
