<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YCence · 工具箱</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="brand-dot"></span>
    <span class="brand-text">YCence</span>
  </a>

  <div class="qq-badge" title="点击复制 QQ 群号" id="qq-badge">
    QQ 群：<b>1104741855</b>
  </div>

  <nav class="crumb" id="crumb"><span>主页</span></nav>
</header>

<main>
  <section class="hero">
    <h1>YCence 工具箱</h1>
    <p>YYCloud-AI Los-you或者小云喵开发，适配所有Scratch社区</p>
  </section>

  <div class="grid">
    <a class="card" href="scripts/index.html">
      <div class="card-arrow">→</div>
      <div class="card-icon">⚡</div>
      <h3>JS 脚本</h3>
      <p>收录常用用户脚本。第一件藏品：变量修改器，1.0.0 至 1.0.4 至臻版一应俱全。</p>
    </a>
    <a class="card" href="runner/index.html">
      <div class="card-arrow">→</div>
      <div class="card-icon">▶</div>
      <h3>直接运行 JS</h3>
      <p>在当前页面执行一段 JavaScript 并实时显示输出。适合临时调试与快速验证。</p>
    </a>
    <a class="card" href="about/index.html">
      <div class="card-arrow">→</div>
      <div class="card-icon">◈</div>
      <h3>YCence</h3>
      <p>了解这个工具箱的来龙去脉、作者信息与技术细节。</p>
    </a>
  </div>
</main>

<div class="toast" id="toast">已复制 QQ 群号</div>

<script>
  document.getElementById('qq-badge').addEventListener('click', async () => {
    const num = '1104741855';
    try {
      await navigator.clipboard.writeText(num);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = num;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    const t = document.getElementById('toast');
    t.classList.add('show');
    clearTimeout(window.__qqToastTimer);
    window.__qqToastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  });
</script>

</body>
</html>
